workflows:
  ios-build:
    name: iOS Unsigned XCArchive + Sideloadly IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      groups:
        - app_env
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Validate required app environment
        script: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install dependencies
        script: |
          npm ci

      - name: Build mobile web assets
        script: |
          npm run build:mobile

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS archive
        script: |
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee /tmp/xcodebuild_logs/xcodebuild-archive.log

      - name: Package unsigned IPA for Sideloadly
        script: |
          rm -rf /tmp/sideloadly_export
          mkdir -p /tmp/sideloadly_export/Payload
          cp -R "$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app" /tmp/sideloadly_export/Payload/
          ditto -c -k --keepParent /tmp/sideloadly_export/Payload "$CM_BUILD_DIR/App-sideloadly.ipa"

    artifacts:
      - $CM_BUILD_DIR/App.xcarchive
      - $CM_BUILD_DIR/App-sideloadly.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-build-ipa:
    name: iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic

    environment:
      node: 22
      groups:
        - app_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.lematosduvoisin.app
      vars:
        APPLE_TEAM_ID: 7X4BK95XBM
        IOS_PROFILE_SPECIFIER: LMDV App Store
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Validate required app environment
        script: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install dependencies
        script: |
          npm ci

      - name: Build mobile web assets
        script: |
          npm run build:mobile

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Verify resolved iOS signing settings
        script: |
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          echo "IOS_PROFILE_SPECIFIER=$IOS_PROFILE_SPECIFIER"
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID PROVISIONING_PROFILE_SPECIFIER=\"$IOS_PROFILE_SPECIFIER\""

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
